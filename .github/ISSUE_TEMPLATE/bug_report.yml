name: Something went wrong
description: A step, a check or the house itself does not work as the runbook says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying claude-house. Please do not paste passwords, proxy credentials, API keys or private paths you would not want public.
  - type: input
    id: step
    attributes:
      label: Which step?
      description: The step id from `house next` or `house check`, for example `vm-online` or `shares`. Write "after setup" if the house was already built.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `house doctor --json`
      description: Run it from the repository root in PowerShell and paste the result. Remove anything private first.
      render: json
  - type: input
    id: windows
    attributes:
      label: Host Windows
      description: Edition, version and display language, for example "Windows 11 Pro 24H2, Chinese".
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent that built the house
      description: For example Claude Code 2.x on the host.
